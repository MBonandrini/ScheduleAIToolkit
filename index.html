<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning Engine — GitHub Edition</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="app">
  <aside class="sidebar"><div class="brand"><h1>Planning Engine</h1><small>GitHub Edition · browser-native</small></div><div id="tree" class="tree"></div></aside>
  <main class="main">
    <div class="topbar">
      <button class="btn" id="newProjectBtn">New Project</button><button class="btn" id="demoBtn">Load Demo</button>
      <button class="btn" id="folderBtn">Import Project Folder</button><input id="folderInput" type="file" webkitdirectory multiple hidden>
      <span class="spacer"></span><span id="saveStatus" class="muted">Local browser storage</span><button class="btn primary" id="buildBtn">Build Project Plan</button>
    </div>
    <div class="content">
      <div id="banner"></div>
      <div class="tabs" id="tabs"></div>
      <section id="view"></section>
    </div>
  </main>
</div>
<dialog id="settingsDialog"><div class="dialog-head"><strong>Free AI & Project Settings</strong><button class="btn" onclick="this.closest('dialog').close()">Close</button></div><div class="dialog-body" id="settingsBody"></div></dialog>
<script type="module" src="js/app.mjs"></script>
</body></html>
