<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Controls AI Suite — Shared Core</title>

<link rel="stylesheet" href="./assets/css/shell.css">
</head>
<body>
<nav class="suite-nav" role="tablist">
  <div class="brand"><span class="logo">✦</span><span>Project Controls AI Suite</span></div>
  <button class="suite-tab active" data-tool="contracts" role="tab" aria-selected="true">Contract Manager</button>
<button class="suite-tab" data-tool="drawing" role="tab" aria-selected="false">Drawing Measurement</button>
<button class="suite-tab" data-tool="assessment" role="tab" aria-selected="false">Schedule Assessment</button>
<button class="suite-tab" data-tool="builder" role="tab" aria-selected="false">Schedule Builder</button>
  <button class="ai-settings-button" id="aiSettingsButton" type="button">AI Settings</button>
  <div class="status" id="status">OmniRoute Auto · low-RAM</div>
</nav>
<main id="host"><div id="loading" class="loading">Opening Contract Manager…</div></main>
<div class="ai-modal-backdrop" id="aiModal" hidden>
  <section class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
    <div class="ai-modal-header"><strong id="aiModalTitle">OmniRoute AI Settings</strong><button type="button" id="aiModalClose">×</button></div>
    <label>OmniRoute API base URL<input id="omniBaseUrl" type="url" autocomplete="off" spellcheck="false"></label>
    <label>Endpoint API key <span>stored for this browser session only</span><input id="omniApiKey" type="password" autocomplete="off"></label>
    <div class="ai-modal-note">Default local endpoint: http://localhost:20128/v1. For GitHub Pages, use an HTTPS OmniRoute endpoint if your browser blocks HTTP localhost from an HTTPS page.</div>
    <div class="ai-modal-status" id="aiModalStatus"></div>
    <div class="ai-modal-actions"><button type="button" id="aiTestButton">Test OmniRoute</button><button type="button" class="primary" id="aiSaveButton">Save</button></div>
  </section>
</div>

<script src="./assets/js/core.js"></script>
<script src="./assets/js/shell.js"></script>
</body>
</html>
