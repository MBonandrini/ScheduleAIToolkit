<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Risk Analysis</title>
<script src="../../assets/js/theme.js"></script>
<link rel="stylesheet" href="../../assets/css/shared.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="risk-app">
<header class="risk-topbar">
  <div class="risk-brand"><span class="risk-logo"><svg class="arc-reactor-mark" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"></circle><path d="M11.5 16.5h25L24 37z"></path><path d="M18 21h12l-6 10z"></path></svg></span><div><strong>Risk Analysis</strong><small>Schedule Risk · QSRA · Scenarios · Mitigation</small></div></div>
  <div class="risk-actions"><select id="modelSelect" class="model-select ai-model-select" data-ai-model-select="true"></select><span id="riskStatus" class="risk-status">Select a schedule from the shared pane</span></div>
</header>
<nav id="riskTabs" class="risk-tabs">
  <button data-view="overview" class="active">Overview</button>
  <button data-view="schedule">Schedule Risk</button>
  <button data-view="register">Risk Register</button>
  <button data-view="quant">Quantitative Risk</button>
  <button data-view="criticality">Criticality</button>
  <button data-view="scenarios">Scenarios</button>
  <button data-view="mitigation">Mitigation</button>
  <button data-view="ai">AI Risk Review</button>
</nav>
<main id="riskWorkspace" class="risk-workspace"></main>
</div>
<script src="../../assets/js/ai-options.js"></script>
<script src="./app.js"></script>
</body>
</html>
